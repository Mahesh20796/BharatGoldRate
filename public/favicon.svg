<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer rim gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="25%" stop-color="#E5B842"/>
      <stop offset="65%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#704D02"/>
    </linearGradient>

    <!-- Inner coin gradient -->
    <radialGradient id="coinFace" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="35%" stop-color="#E5B842"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7B5604"/>
    </radialGradient>

    <!-- Rupee 3D bevel gradients -->
    <linearGradient id="rupeeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="40%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>

    <linearGradient id="rupeeShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E3E02"/>
      <stop offset="100%" stop-color="#382500"/>
    </linearGradient>

    <!-- Drop shadow for the coin -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Coin outer circle with rim -->
  <circle cx="256" cy="256" r="236" fill="url(#goldRim)" filter="url(#shadow)"/>

  <!-- Reeded / Milled outer edge pattern -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#7A5305" stroke-width="3"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#FFEAA0" stroke-width="4" stroke-dasharray="6 4"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#684501" stroke-width="2"/>

  <!-- Coin inner recessed table -->
  <circle cx="256" cy="256" r="196" fill="url(#coinFace)"/>
  
  <!-- Subtle inner border ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5"/>

  <!-- Rupee Symbol 3D Bevel Shadow -->
  <path d="M 174 138 L 338 138 M 174 184 L 322 184 M 174 138 L 174 246 C 242 246 292 222 292 180 C 292 148 250 142 180 142 M 174 246 L 278 246 M 224 246 L 338 376" 
        fill="none" stroke="url(#rupeeShadow)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 7)"/>

  <!-- Rupee Symbol Foreground -->
  <path d="M 174 138 L 338 138 M 174 184 L 322 184 M 174 138 L 174 246 C 242 246 292 222 292 180 C 292 148 250 142 180 142 M 174 246 L 278 246 M 224 246 L 338 376" 
        fill="none" stroke="url(#rupeeFace)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Specular highlight on top bar -->
  <path d="M 180 134 L 332 134" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 180 180 L 316 180" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
</svg>
